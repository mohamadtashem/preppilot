<style>
.pp-splash{position:fixed;inset:0;z-index:1000000;background:#1B1F22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;pointer-events:none;animation:pp-out .6s ease 2.7s forwards}
.pp-splash svg{width:min(200px,42vw);height:auto;overflow:visible}
.pp-bar{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:pp-grow .55s cubic-bezier(.2,.8,.2,1) forwards}
.pp-b1{animation-delay:.05s}.pp-b2{animation-delay:.15s}.pp-b3{animation-delay:.25s}.pp-b4{animation-delay:.35s}.pp-b5{animation-delay:.45s}
.pp-line{stroke-dasharray:1;stroke-dashoffset:1;animation:pp-draw .7s ease-out .8s forwards}
.pp-node{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pp-pop .32s cubic-bezier(.3,1.6,.5,1) forwards}
.pp-n1{animation-delay:.9s}.pp-n2{animation-delay:1.02s}.pp-n3{animation-delay:1.14s}.pp-n4{animation-delay:1.26s}.pp-n5{animation-delay:1.45s}
.pp-ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:pp-ring .9s ease-out 1.7s forwards}
.pp-name{font:700 clamp(30px,5vw,46px)/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#FFFFFF;letter-spacing:-.02em;opacity:0;transform:translateY(10px);animation:pp-rise .5s ease 1.4s forwards}
.pp-by{font:500 14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:#C9CED2;letter-spacing:.14em;text-transform:uppercase;opacity:0;transform:translateY(8px);animation:pp-rise .5s ease 1.6s forwards}
@keyframes pp-grow{to{transform:scaleY(1)}}
@keyframes pp-draw{to{stroke-dashoffset:0}}
@keyframes pp-pop{to{transform:scale(1)}}
@keyframes pp-ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(3.4)}}
@keyframes pp-rise{to{opacity:1;transform:none}}
@keyframes pp-out{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion: reduce){.pp-splash{display:none}}
</style>
<div class="pp-splash" aria-hidden="true">

<circle class="pp-node pp-n1" cx="22" cy="63" r="3.8" fill="#FFFFFF" stroke="#1B1F22" stroke-width="2.5"/>
